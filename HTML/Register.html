<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - StudentHub</title>
    <link rel="stylesheet" href="StudentHub.css">
</head>
    <body>
        <h1>📝 Student Registration</h1>
        <p>Create your StudentHub account to stay connected with campus activities.</p>
        <form class="register-form">
            <label>Full Name:</label>
            <input type="text" placeholder="Enter full name">
            <br><br>
            <label>Email Address:</label>
            <input type="email" placeholder="Enter email">
            <br><br>
            <label>Phone Number:</label>
            <input type="text" placeholder="Enter phone number">
            <br><br>
            <label>Date of Birth:</label>
            <input type="date">
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br><br>
            <label>Enrollment Number:</label>
            <input type="number" placeholder="Enter enrollment number">
            <br><br>
            <label>Department:</label>
            <select>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Commerce</option>
                <option>Management</option>
            </select>
            <br><br>
            <label>Course:</label>
            <input type="text" placeholder="e.g., B.Tech, BCA">
            <br><br>
            <label>Semester:</label>
            <input type="number" min="1" max="8" placeholder="Enter semester">
            <br><br>
            <label>Password:</label>
            <input type="password" placeholder="Create password">
            <br><br>
            <label>Confirm Password:</label>
            <input type="password" placeholder="Re-enter password">
            <br><br>
                <button type="submit">Register</button>
                <button type="reset">Clear</button>
            <br><br>
        </form>
        <br><br>
        <footer>StudentHub © 2026</footer>
    </body>
</html>
