<!DOCTYPE html>
<html lang="en">
<head>
    <title>Feedback - StudentHub</title>
    <link rel="stylesheet" href="StudentHub.css">
</head>
<body>

    <h1>💬 Feedback</h1>

    <div>
        <p>
            Thank you for visiting StudentHub. Please share your experience to help us improve our services.
        </p>

        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter full name">

            <label>Enrollment Number:</label>
            <input type="text" placeholder="Enter enrollment number">

            <label>Email Address:</label>
            <input type="email" placeholder="Enter email address">

            <label>Department:</label>
            <input type="text" placeholder="Enter department">

            <label>Rate your experience:</label>
            <div class="rating-group">
                <input type="radio" name="rating" value="excellent"> Excellent
                <input type="radio" name="rating" value="good"> Good
                <input type="radio" name="rating" value="average"> Average
                <input type="radio" name="rating" value="bad"> Bad
            </div>

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

    <footer>StudentHub © 2026</footer>

</body>
</html>
