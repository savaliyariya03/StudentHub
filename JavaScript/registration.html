<!DOCTYPE html>
<html>
    <head>
        <title> Registration Form </title>
        <link rel="stylesheet" href="registration.css">
    </head>
    <body>
        <div class="container">
        <h1> Registration Form </h1>
        <form id="registrationForm">
            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span id="name-error"></span>
            <br><br>
            
            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span id="email-error"></span>
            <br><br>
            
            <label>Mobile No.:</label>
            <input type="tel" id="mobileno" placeholder="Enter your mobile number">
            <span id="mobile-error"></span>
            <br><br>
            
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            <span id="password-error"></span>
            <br><br>
            
            <label>Confirm password:</label>
            <input type="password" id="confirm" placeholder="Enter confirm password">
            <span id="confirm-error"></span>
            <br><br>
            
            <label>Course:</label>
            <select id="course">
                <option value="B. Tech">B. Tech</option>
                <option value="BCA">BCA</option>
                <option value="B. sc">B. sc</option>
                <option value="BBA">BBA</option>
            </select>
            <span id="course-error"></span>
            <br><br>
            
            <label>Year:</label>
            <select id="year">
                <option value="1">1 Year</option>
                <option value="2">2 Year</option>
                <option value="3">3 Year</option>
                <option value="4">4 Year</option>
            </select>
            <span id="year-error"></span>
            <br><br>
            
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
            <span id="gender-error"></span>
            <br><br>

            <div class="terms">
                <input type="checkbox" id="terms">
                I accept the Terms and Conditions.
                <span id="terms-error"></span>
            </div>
            <br><br>

            <button type="submit">Submit</button>
            <p id="successMessage"></p>
        </form>
        </div>
        <script src="registration.js"></script>
    </body>
</html>
